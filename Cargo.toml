[workspace]
resolver = "2"
members = ["onisyncd", "onisync-core", "onisync", "onisync-bridge"]

[workspace.dependencies]
onisync-core = { path = "onisync-core" }
onisyncd = { path = "onisyncd" }

android_logger = "0.15.1"
base64 = "0.23.0"
blake3 = "1.8.5"
clap = { version = "4.5.20", features = ["derive"] }
comfy-table = { version = "7", features = ["custom_styling"] }
ed25519-dalek = "3.0.0"
env_logger = "0.11"
# Pinned to the exact version of `flutter_rust_bridge_codegen` in the dev shell
# (flake.nix); the runtime crate and the generator must match.
flutter_rust_bridge = "=2.12.0"
futures-util = "0.3.33"
jni = "0.22.4"
log = "0.4.33"
notify = "8.2.0"
owo-colors = "4.3.0"
rand = "0.10.2"
rmp-serde = "1.3.1"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48" }
tokio-tungstenite = "0.30"
tokio-util = "0.7"
uuid = { version = "1.11", features = ["v4", "serde"] }
walkdir = "2.5"
